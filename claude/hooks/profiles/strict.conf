# strict — for unattended loops, shared machines, and repos you don't fully trust.
# Prompt-injection hits block instead of warn; a session and a daily spend ceiling are on;
# and the security hooks fail CLOSED (a crashed, missing or timed-out guardrail blocks the
# action instead of waving it through — settings re-rendered by `compass profile strict`).
redteam_enforce=1
max_usd=10
max_usd_day=50
fail_closed=1
