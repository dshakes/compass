<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" font-family="'Space Grotesk',system-ui,sans-serif" role="img" aria-label="The self-fixing SDLC loop: build, review, auto-fix, re-check — repeat until tests and review pass, then a human merges.">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#2ee6cf"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5b9dff" stroke-width="1.4"/></marker>
    <style>text{fill:#e9ecf3}.m{font-family:ui-monospace,'JetBrains Mono',monospace}.mut{fill:#98a2b6}.dim{fill:#6b7488}</style>
  </defs>

  <rect x="1" y="1" width="638" height="398" rx="18" fill="#0b0d13" stroke="rgba(255,255,255,.09)"/>
  <text x="30" y="42" font-size="17" font-weight="700">🧭 compass · the self-fixing loop</text>
  <text x="30" y="63" class="m mut" font-size="12">generate → test → critique → fix, until a gate says done</text>

  <circle cx="320" cy="215" r="120" fill="none" stroke="url(#lg)" stroke-width="1.5" opacity=".28" stroke-dasharray="5 7"/>

  <g fill="none" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ar)" opacity=".85">
    <path d="M344,127 A120,120 0 0 1 408,191"/>
    <path d="M408,239 A120,120 0 0 1 344,303"/>
    <path d="M296,303 A120,120 0 0 1 232,239"/>
    <path d="M232,191 A120,120 0 0 1 296,127"/>
  </g>

  <rect x="260" y="195" width="120" height="40" rx="10" fill="rgba(46,230,207,.10)" stroke="#2ee6cf" stroke-width="1.5"/>
  <text x="320" y="213" text-anchor="middle" class="m" font-size="12" fill="#2ee6cf">GATE</text>
  <text x="320" y="228" text-anchor="middle" class="m dim" font-size="10">tests + review pass</text>

  <g text-anchor="middle">
    <g><circle cx="320" cy="103" r="34" fill="#0f1219" stroke="url(#lg)" stroke-width="2"/><text x="320" y="100" font-size="13" font-weight="600">build</text><text x="320" y="118" font-size="15">✎</text></g>
    <g><circle cx="432" cy="215" r="34" fill="#0f1219" stroke="url(#lg)" stroke-width="2"/><text x="432" y="212" font-size="13" font-weight="600">review</text><text x="432" y="230" font-size="15">🔎</text></g>
    <g><circle cx="320" cy="327" r="34" fill="#0f1219" stroke="url(#lg)" stroke-width="2"/><text x="320" y="324" font-size="13" font-weight="600">auto-fix</text><text x="320" y="342" font-size="15">🔧</text></g>
    <g><circle cx="208" cy="215" r="34" fill="#0f1219" stroke="url(#lg)" stroke-width="2"/><text x="208" y="212" font-size="13" font-weight="600">re-check</text><text x="208" y="230" font-size="15">✓</text></g>
  </g>

  <text x="320" y="384" text-anchor="middle" class="mut" font-size="13">→ then it stops at <tspan fill="#c4a5ff" font-weight="600">you</tspan>. That gate never moves.</text>
</svg>
