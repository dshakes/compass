# Classifier (Claude · haiku) — work-type routing. On PR open/reopen, classifies the diff
# into one `domain:*` and labels the PR, so domain-specific reviewers (e.g. design review)
# can gate on it. Cheap (haiku, one structured call). The always-on reviewers
# (Reviewer, Security, QA, Auditor) run regardless — routing only ADDS targeted review.
name: "sdlc · classify (Claude)"

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write          # labels are an issues resource — needed to apply domain:*
  pull-requests: write
  id-token: write

concurrency:
  group: sdlc-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    # dependabot-actor runs get Dependabot's (empty) secret store — agent can't auth, so skip
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the change
        id: classify
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action v1.0.134+ does an app-token exchange that requires a token
          # (or a workflow matching the default branch); pass the built-in one explicitly.
          github_token: ${{ github.token }}
          # ACCEPTED (SECURITY/Low): base.ref is interpolated into the PROMPT (never a run:
          # block — no shell injection). It's a branch name, collaborator-controlled at
          # most (fork PRs are skipped above). $GITHUB_BASE_REF in-prompt was tried and
          # broke the action's bash env (#76); the residual prompt-injection risk from a
          # hostile same-repo branch name is accepted and documented here.
          prompt: |
            You are **Classifier** (agent:classify). Look at this PR's diff
            (`git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`) and pick the
            SINGLE best-fit work domain. Do not comment or edit; just return the verdict.

            YOUR TOOLS ARE EXACTLY: Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)
            Nothing else is available. A call outside that set is DENIED and costs you a
            turn you do not get back — you have 6. Use Read instead of cat, Glob
            instead of find or ls, and Grep instead of grep-via-Bash. Do not probe.
            - ui: frontend / UI / styling / UX
            - api: API / SDK / public contracts / interface changes
            - infra: CI / deploy / IaC / migrations / build
            - docs: documentation only
            - core: core library / business logic (default if mixed/unclear)
          claude_args: |
            --model haiku
            --max-turns 6
            --max-budget-usd 0.30
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"domain":{"type":"string","enum":["ui","api","infra","docs","core"]}},"required":["domain"]}'
      - name: Apply the domain label
        env:
          # classify only LABELS (never pushes), so the built-in GITHUB_TOKEN is enough —
          # no dependency on SDLC_BOT_TOKEN. Needs issues:write (granted above).
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUT: ${{ steps.classify.outputs.structured_output }}
        run: |
          set -uo pipefail
          domain="$(printf '%s' "$OUT" | jq -r '.domain // "core"' 2>/dev/null || echo core)"
          case "$domain" in ui|api|infra|docs|core) ;; *) domain=core ;; esac
          echo "domain: $domain"
          for d in ui api infra docs core; do
            [ "$d" = "$domain" ] || gh pr edit "$PR" --remove-label "domain:$d" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR" --add-label "domain:$domain"
