name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck

      - name: doctor (JSON, frontmatter, plugin sync, executability)
        run: make doctor

      - name: Docs stay version-agnostic (no pinned release in install/checkout commands)
        run: |
          # Install/checkout commands must not hardcode a release — use
          # `git checkout $(git describe --tags --abbrev=0)` so docs don't rot each release.
          # Illustrative version mentions in prose are fine; only clone/checkout command
          # context is gated. docs/internal/ is excluded (not product docs) by the glob.
          if grep -rnE '(git (clone|checkout)|checkout )[^`]*v0\.[0-9]+\.[0-9]+' README.md docs/*.md; then
            echo "::error::hardcoded release version in an install/checkout command above — make it version-agnostic"
            exit 1
          fi

      - name: Homebrew formula tracks the latest release (no stale package)
        run: |
          # The release workflow opens a formula-bump PR on each tag; this guard
          # fails main if that PR never merged, so `brew install` can't go stale.
          git fetch --tags --quiet 2>/dev/null || true
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$latest" ]; then echo "no tags yet — skipping"; exit 0; fi
          pinned="v$(grep -oE 'tags/v[0-9]+\.[0-9]+\.[0-9]+' Formula/compass.rb | head -1 | sed 's|tags/v||')"
          if [ "$pinned" != "$latest" ]; then
            echo "::error::Formula/compass.rb pins $pinned but the latest release tag is $latest — merge the formula-bump PR (url + sha256)."
            exit 1
          fi
          # Belt-and-suspenders: the pinned sha256 must match the real release tarball.
          url="https://github.com/${GITHUB_REPOSITORY:-dshakes/compass}/archive/refs/tags/$latest.tar.gz"
          got="$(curl -fsSL "$url" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)"
          want="$(grep -oE 'sha256 "[a-f0-9]{64}"' Formula/compass.rb | grep -oE '[a-f0-9]{64}')"
          if [ -n "$got" ] && [ "$got" != "$want" ]; then
            echo "::error::formula sha256 ($want) != $latest tarball ($got) — re-run the bump."
            exit 1
          fi
          [ -z "$got" ] && echo "::warning::could not fetch tarball to verify sha256 (network) — version check still passed"
          echo "formula pins $pinned = latest tag $latest, sha256 verified ✓"

      - name: shellcheck (errors fail the build)
        run: shellcheck -S error claude/hooks/*.sh claude/hooks/lib/*.sh claude/statusline.sh scripts/*.sh bin/compass install.sh quickstart.sh claude/skills/*/*.sh sdlc/*.sh router/*.sh

      - name: shellcheck (style — informational)
        run: shellcheck -S style claude/hooks/*.sh scripts/*.sh install.sh || true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows + SDLC templates (actionlint + embedded shellcheck)
        env:
          SHELLCHECK_OPTS: --severity=error   # match the repo's error-level gate
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/*.yml sdlc/workflows/*.yml sdlc/selfhosted/*.yml \
            sdlc/routines/*.yml sdlc/fleet/*.yml

      - name: Guardrail bypass corpus (protect-paths policy eval)
        run: bash scripts/test-protect-paths.sh

      - name: Budget ceiling (live spend hard-gate eval — session + daily)
        run: bash scripts/test-budget-gate.sh

      - name: Comprehension-rot guard (compass digest sampling + ledger)
        run: bash scripts/test-digest.sh

      - name: Secret self-scan (no credential lands in the repo)
        run: bash scripts/compass-scan.sh --all

      - name: MCP supply-chain audit (version pins + manifest integrity)
        run: bash scripts/check-mcp.sh

      - name: Router module (accuracy + cost-at-iso-quality, gated)
        run: bash router/test.sh

      - name: Router cache savings (cache-aware cost-min, gated)
        run: bash router/bench.sh --cache

      - name: Router spec validation + ReDoS lint
        run: bash router/validate.sh

      - name: compass CLI tests (route · spend · impact · notify · listen parser)
        run: bash scripts/test-cli.sh

      - name: Agent Trace provenance (emit · attach · verify round-trip)
        run: bash scripts/test-trace.sh

      - name: CI auto-fix eval (ci-watch routine + sdlc-ci-fix rails)
        run: bash scripts/test-ci-watch.sh

      - name: Listener command parser (compass listen)
        run: node scripts/test-listen.mjs

      - name: Workflow scripts (shape + JS syntax)
        run: bash scripts/check-workflows.sh

      - name: Actions audit (mirror drift · least-privilege · SHA-pinning · run-block injection)
        run: bash scripts/check-actions.sh

      - name: Router eval (accuracy floor gates autoroute)
        run: bash scripts/compass-route.sh --eval

      - name: Benchmark scorecard (guardrail precision/recall + router accuracy, gated)
        run: bash scripts/compass-bench.sh

      - name: SDLC loop self-test (round cap + verdict parsing)
        run: bash sdlc/selftest.sh

      - name: Task benchmark (structure + pre-fix oracle, no tokens)
        run: bash sdlc/taskbench/validate.sh

      - name: compass-memory store tests (redaction + trust tiers)
        run: python3 mcp/compass-memory/test_store.py

      - name: Plugin is in sync with claude/ source
        run: ./scripts/sync-plugin.sh --check
