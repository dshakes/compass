<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea44f"/><stop offset="0.5" stop-color="#8A63D2"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <rect x="1" y="1" width="1238" height="378" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="376" width="1238" height="4" fill="url(#acc)"/>

  <!-- header -->
  <g transform="translate(46,44)">
    <circle r="18" fill="#161b22" stroke="#8A63D2" stroke-width="2.4"/>
    <path d="M0,-10 A10,10 0 1 1 -8.7,5" fill="none" stroke="#58a6ff" stroke-width="2.8" stroke-linecap="round"/>
    <polygon points="-11,1.6 -5.8,7.6 -13.4,9.2" fill="#58a6ff"/>
    <text x="32" y="-1" font-size="23" font-weight="800" fill="#f0f6fc">router pipeline</text>
    <text x="33" y="20" font-size="13" fill="#8b949e">deterministic · offline · doubly eval-gated — every stage past <tspan fill="#adbac7" font-weight="700">bias</tspan> is OFF unless its signal is set (parity with v1.0)</text>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#adbac7" font-weight="600" transform="translate(792,40)">
    <rect x="0"  y="-9" width="14" height="11" rx="3" fill="#10231a" stroke="#3fb950" stroke-width="1.5"/><text x="20" y="1">core</text>
    <rect x="78" y="-9" width="14" height="11" rx="3" fill="#1b1630" stroke="#a371f7" stroke-width="1.5"/><text x="98" y="1">cache/cascade</text>
    <rect x="206" y="-9" width="14" height="11" rx="3" fill="#241c0c" stroke="#e3b341" stroke-width="1.5"/><text x="226" y="1">cost dial</text>
    <rect x="292" y="-9" width="14" height="11" rx="3" fill="#0f1822" stroke="#58a6ff" stroke-width="1.5"/><text x="312" y="1">quality bound</text>
  </g>

  <!-- task in -->
  <text x="40" y="196" font-size="13" font-weight="700" fill="#7d8590">task</text>
  <line x1="68" y1="190" x2="92" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ten stage chips. x0=96, pitch=112, w=92, y=160 h=60 -->
  <g font-weight="700" text-anchor="middle">
    <!-- 1 decide (core, solid) -->
    <g><rect x="96"  y="160" width="92" height="60" rx="10" fill="#10231a" stroke="#3fb950" stroke-width="1.8"/>
       <text x="142" y="186" font-size="13" fill="#f0f6fc">decide</text><text x="142" y="203" font-size="9.5" fill="#8b949e">keyword tier</text></g>
    <!-- 2 confidence -->
    <g><rect x="208" y="160" width="92" height="60" rx="10" fill="#10231a" stroke="#3fb950" stroke-width="1.8"/>
       <text x="254" y="186" font-size="13" fill="#f0f6fc">confidence</text><text x="254" y="203" font-size="9.5" fill="#8b949e">0–99</text></g>
    <!-- 3 length -->
    <g><rect x="320" y="160" width="92" height="60" rx="10" fill="#10231a" stroke="#3fb950" stroke-width="1.8"/>
       <text x="366" y="186" font-size="13" fill="#f0f6fc">length</text><text x="366" y="203" font-size="9.5" fill="#8b949e">long→floor</text></g>
    <!-- 4 bias (conditional) -->
    <g><rect x="432" y="160" width="92" height="60" rx="10" fill="#10231a" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5 3"/>
       <text x="478" y="186" font-size="13" fill="#f0f6fc">bias</text><text x="478" y="203" font-size="9.5" fill="#8b949e">weak picks</text></g>
    <!-- 5 cache (cost dial / purple, off unless warm) -->
    <g><rect x="544" y="160" width="92" height="60" rx="10" fill="#1b1630" stroke="#a371f7" stroke-width="2" stroke-dasharray="5 3"/>
       <text x="590" y="186" font-size="13" fill="#f0f6fc">cache</text><text x="590" y="203" font-size="9.5" fill="#b794f6">warm-affinity</text></g>
    <!-- 6 escalation (cascade) -->
    <g><rect x="656" y="160" width="92" height="60" rx="10" fill="#1b1630" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 3"/>
       <text x="702" y="186" font-size="12.5" fill="#f0f6fc">escalate</text><text x="702" y="203" font-size="9.5" fill="#b794f6">→ LLM judge</text></g>
    <!-- 7 budget (amber) -->
    <g><rect x="768" y="160" width="92" height="60" rx="10" fill="#241c0c" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="5 3"/>
       <text x="814" y="186" font-size="13" fill="#f0f6fc">budget</text><text x="814" y="203" font-size="9.5" fill="#e9c46a">spend cap</text></g>
    <!-- 8 latency (amber) -->
    <g><rect x="880" y="160" width="92" height="60" rx="10" fill="#241c0c" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="5 3"/>
       <text x="926" y="186" font-size="13" fill="#f0f6fc">latency</text><text x="926" y="203" font-size="9.5" fill="#e9c46a">speed cap</text></g>
    <!-- 9 clamps (blue) -->
    <g><rect x="992" y="160" width="92" height="60" rx="10" fill="#0f1822" stroke="#58a6ff" stroke-width="1.8"/>
       <text x="1038" y="186" font-size="13" fill="#f0f6fc">clamps</text><text x="1038" y="203" font-size="9.5" fill="#9cd0ff">floor·ceiling</text></g>
    <!-- 10 domain (blue, off unless domain_floors) -->
    <g><rect x="1104" y="160" width="92" height="60" rx="10" fill="#0f1822" stroke="#58a6ff" stroke-width="1.8" stroke-dasharray="5 3"/>
       <text x="1150" y="186" font-size="13" fill="#f0f6fc">domain</text><text x="1150" y="203" font-size="9.5" fill="#9cd0ff">quality floor</text></g>
  </g>
  <!-- connectors between chips -->
  <g stroke="#8b949e" stroke-width="2">
    <line x1="188"  y1="190" x2="206"  y2="190" marker-end="url(#ar)"/>
    <line x1="300"  y1="190" x2="318"  y2="190" marker-end="url(#ar)"/>
    <line x1="412"  y1="190" x2="430"  y2="190" marker-end="url(#ar)"/>
    <line x1="524"  y1="190" x2="542"  y2="190" marker-end="url(#ar)"/>
    <line x1="636"  y1="190" x2="654"  y2="190" marker-end="url(#ar)"/>
    <line x1="748"  y1="190" x2="766"  y2="190" marker-end="url(#ar)"/>
    <line x1="860"  y1="190" x2="878"  y2="190" marker-end="url(#ar)"/>
    <line x1="972"  y1="190" x2="990"  y2="190" marker-end="url(#ar)"/>
    <line x1="1084" y1="190" x2="1102" y2="190" marker-end="url(#ar)"/>
  </g>
  <!-- tier out -->
  <line x1="1196" y1="244" x2="1196" y2="266" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/>
  <g text-anchor="middle">
    <rect x="1130" y="266" width="92" height="30" rx="9" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
    <text x="1176" y="286" font-size="12.5" font-weight="800" fill="#3fb950">tier</text>
  </g>

  <!-- bottom band: grouping captions -->
  <g font-size="11" fill="#6e7681" text-anchor="middle">
    <text x="254" y="246">① classify &amp; shape (always)</text>
    <text x="646" y="246">② cache + escalation cascade</text>
    <text x="870" y="246">③ cost/latency dials</text>
    <text x="1094" y="246">④ quality bounds</text>
  </g>

  <!-- footer -->
  <text x="620" y="344" text-anchor="middle" font-size="12.5" fill="#8b949e">spec (<tspan fill="#adbac7" font-weight="700">router.json</tspan>) is <tspan fill="#58a6ff" font-weight="700">validated + ReDoS-linted</tspan>, not trusted · cache savings <tspan fill="#a371f7" font-weight="700">measured</tspan> by <tspan fill="#adbac7" font-weight="700">bench.sh --cache</tspan> · deterministic, no model call</text>
</svg>
